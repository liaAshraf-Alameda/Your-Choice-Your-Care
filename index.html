<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>حكايتي مع المرض — Neon Patient Care Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>حكايتي مع المرض</h1>
      <p class="subtitle">لعبة تصويت تفاعلية لتعلّم رعاية متمحورة بالمريض</p>
    </header>

    <section id="story" class="card intro"></section>

    <section id="round-area" class="card hidden">
      <div class="top-row">
        <div class="patient-info">
          <h2 id="patient-title">عنوان المريض — الجولة</h2>
          <p id="patient-desc">وصف المريض...</p>
          <label class="audience-label">اسم المشارك:
            <input id="audience-name" type="text" placeholder="ادخل اسمك (اختياري)">
          </label>
        </div>
        <div class="patient-media">
          <img id="patient-image" src="images/placeholder.png" alt="patient image">
        </div>
      </div>

      <div id="round-area-body">
        <h3 id="round-subtitle"></h3>
        <div id="question-list" class="questions"></div>

        <div class="actions">
          <button id="submit-votes" class="btn primary">أرسل تصويتك</button>
          <button id="next-round" class="btn secondary hidden">الجولة التالية</button>
        </div>

        <div id="round-result" class="round-result hidden">
          <h3>نتائج الجولة</h3>
          <div id="vote-bars" class="vote-bars" aria-hidden="true"></div>
          <div id="round-note" class="round-note"></div>
        </div>
      </div>
    </section>

    <section id="final-area" class="card hidden">
      <h2>النتيجة النهائية</h2>
      <div id="final-summary"></div>
      <div id="scoreboard"></div>
      <div class="actions">
        <button id="restart" class="btn primary">أعد اللعبة</button>
      </div>
    </section>

    <footer class="credits">
      <p>تصميم تفاعلي تعليمي — نسق نيوني مع دعم RTL</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
